seed: ${..seed}
algo: PPO
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 8]

load_path: ${..checkpoint} # path to the checkpoint to load

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: ${...task.env.numEnvs}
  normalize_advantage: True
  gamma: 0.99
  tau: 0.95
  learning_rate: 5e-3
  kl_threshold: 0.02
  # PPO batch collection
  horizon_length: 8
  minibatch_size: 32768
  mini_epochs: 5
  # PPO loss setting
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  # grad clipping
  truncate_grads: True
  grad_norm: 1.0
  # snapshot setting
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 200_000_000
  nn_dir: stage2_nn
  wandb_group: ''
  # hora setting
  priv_info: False
  priv_info_dim: 9
  priv_info_embed_dim: 8
  use_shape_priv_info: False
  shape_embed_dim: 32
  pointnet_units: [32, 32, 32]
  n_pointcloud_pts: 1024
  asymmetric_critic: False
  actor_use_privileged_info: True
  recurrent_obs: False
  recurrent_obs_seq_len: 3
  recurrent_hidden_size: 128
  contact_reset_recurrent: False
  contact_event_gating: False
  contact_num_modes: 4
  contact_gate_hidden_size: 32
  contact_tactile_dim: 12
  contact_history_len: 3
  contact_gate_event_features: False
  contact_gate_threshold: 0.05
  contact_gate_balance_coef: 0.0
  contact_gate_switch_coef: 0.0
  contact_options: False
  contact_option_max_dwell: 12
  contact_option_min_dwell: 2
  contact_option_boundary_mode: soft
  contact_option_entropy_coef: 0.002
  contact_termination_entropy_coef: 0.001
  contact_termination_sparsity_coef: 0.01
  contact_min_dwell_loss_coef: 0.0
  contact_option_balance_coef: 0.0
  contact_transition_aux_loss: False
  contact_transition_aux_coef: 0.05
  contact_transition_aux_threshold: 0.05
  td3_replay_size: 100000
  td3_batch_size: 32768
  td3_learning_starts: 80000
  td3_policy_delay: 2
  td3_exploration_noise: 0.1
  td3_target_noise: 0.2
  td3_target_noise_clip: 0.5
  td3_target_tau: 0.005
  td3_reward_scale: 0.01
  proprio_adapt: False
  adapt_latent_loss_coef: 1.0
  adapt_action_loss_coef: 1.0
